name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Platform validation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile platform modules
        run: python -m compileall app

      - name: Mission Control API contract
        run: python -m app.platform.api_contract

      - name: GCP readiness
        run: python -m app.platform.gcp.readiness

      - name: Platform deploy checks
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.ops_check
          python -m app.platform.gcp.deploy_check
          python -m app.platform.gcp.cost_check

      - name: Release gate
        run: bash infra/scripts/gate.sh
