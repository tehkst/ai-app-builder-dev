name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Platform validation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile platform modules
        run: python -m compileall app

      - name: Mission Control API contract
        run: python -m app.platform.api_contract

      - name: GCP readiness
        run: python -m app.platform.gcp.readiness

      - name: Platform deploy checks
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.ops_check
          python -m app.platform.gcp.deploy_check
          python -m app.platform.gcp.cost_check

      - name: Release gate
        run: bash infra/scripts/gate.sh

  # ------------------------------------------------------------------
  # Native Coding Agent (Python 3.9 target) — separate qualification job
  # ------------------------------------------------------------------
  coding-agent-39:
    name: Coding Agent (Python 3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Coding Agent compile (Python 3.9)
        run: python -m compileall -q app/platform/coding_agent

      - name: Coding Agent unit tests (46 tests)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m unittest app.platform.coding_agent.tests.test_coding_agent -v

      - name: Coding Agent Stage D OAT
        env:
          NATIVE_CODING_AGENT_ENABLED: "true"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_PROVIDER: deepseek
        run: python -m app.platform.coding_agent.qualification.stage_d
