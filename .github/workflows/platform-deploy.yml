name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      publish_image:
        description: Publish container image
        required: true
        default: false
        type: boolean
      deploy_service:
        description: Deploy service to Cloud Run
        required: true
        default: false
        type: boolean
      apply_infra:
        description: Apply infrastructure changes
        required: true
        default: false
        type: boolean
      use_remote_backend:
        description: Use remote Terraform backend
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run platform gates
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.ops_check
          python -m app.platform.gcp.readiness
          python -m app.platform.gcp.deploy_check
          python -m app.platform.gcp.cost_check
          bash infra/scripts/gate.sh

  terraform:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Authenticate to cloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init local
        if: ${{ !inputs.use_remote_backend }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init -backend=false

      - name: Terraform init remote
        if: ${{ inputs.use_remote_backend && vars.TF_STATE_BUCKET != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-software-factory/${{ inputs.environment }}"

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform plan
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="runtime_service_account_email=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            -out=tfplan

      - name: Terraform plan json
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform show -json tfplan > tfplan.json

      - name: cost_review
        if: ${{ vars.GCP_PROJECT_ID != '' && vars.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ vars.INFRACOST_API_KEY }}

      - name: Infracost estimate
        if: ${{ vars.GCP_PROJECT_ID != '' && vars.INFRACOST_API_KEY != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file infracost.json
          infracost output \
            --path infracost.json \
            --format table

      - name: Enforce monthly cost ceiling
        if: ${{ vars.GCP_PROJECT_ID != '' && vars.INFRACOST_API_KEY != '' && vars.MAX_MONTHLY_COST_USD != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          python - <<'PY'
          import json
          import os
          from decimal import Decimal

          limit = Decimal(os.environ["MAX_MONTHLY_COST_USD"])
          data = json.load(open("infracost.json", encoding="utf-8"))
          total = Decimal(str(data.get("totalMonthlyCost") or "0"))
          print(f"Estimated monthly cost: USD {total}")
          print(f"Configured monthly ceiling: USD {limit}")
          if total > limit:
              raise SystemExit(f"Estimated monthly cost exceeds ceiling: {total} > {limit}")
          PY
        env:
          MAX_MONTHLY_COST_USD: ${{ vars.MAX_MONTHLY_COST_USD }}

      - name: Terraform apply
        if: ${{ inputs.apply_infra && vars.GCP_PROJECT_ID != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan

  docker:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to cloud
        if: ${{ inputs.publish_image && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for registry
        if: ${{ inputs.publish_image && vars.GCP_REGISTRY_HOST != '' }}
        run: gcloud auth configure-docker "${{ vars.GCP_REGISTRY_HOST }}" --quiet

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ vars.CONTAINER_IMAGE_PREFIX }}" ]; then
            echo "tag=${{ vars.CONTAINER_IMAGE_PREFIX }}/control-plane:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ai-software-factory:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard image publish variables
        if: ${{ inputs.publish_image && vars.CONTAINER_IMAGE_PREFIX == '' }}
        run: |
          echo "CONTAINER_IMAGE_PREFIX must be configured before publishing images."
          exit 1

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish_image }}
          tags: ${{ steps.image.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker
    if: ${{ inputs.deploy_service }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Guard deploy inputs
        if: ${{ !inputs.publish_image || vars.GCP_PROJECT_ID == '' || vars.GCP_REGION == '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' }}
        run: |
          echo "deploy_service requires publish_image plus GCP project, region, workload identity, and deploy service account variables."
          exit 1

      - name: Authenticate to cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy ai-software-factory-${{ inputs.environment }} \
            --image="${{ needs.docker.outputs.image_tag }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3

      - name: Resolve service URL
        id: service
        run: |
          url=$(gcloud run services describe ai-software-factory-${{ inputs.environment }} \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Service URL: $url"

      - name: Verify Mission Control health
        run: |
          curl --fail --silent --show-error "${{ steps.service.outputs.url }}/health"
          curl --fail --silent --show-error "${{ steps.service.outputs.url }}/ready"
          curl --fail --silent --show-error "${{ steps.service.outputs.url }}/mission-control/health"
          curl --fail --silent --show-error "${{ steps.service.outputs.url }}/mission-control/version"

  summary:
    runs-on: ubuntu-latest
    needs:
      - validate
      - terraform
      - docker
      - deploy
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish image: ${{ inputs.publish_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy service: ${{ inputs.deploy_service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Apply infra: ${{ inputs.apply_infra }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Remote backend: ${{ inputs.use_remote_backend }}" >> "$GITHUB_STEP_SUMMARY"
