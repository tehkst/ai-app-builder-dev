name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      publish_image:
        description: Publish container image
        required: true
        default: false
        type: boolean
      apply_infra:
        description: Apply infrastructure changes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run platform gates
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.ops_check
          python -m app.platform.gcp.readiness
          python -m app.platform.gcp.deploy_check
          bash infra/scripts/gate.sh

  terraform:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform plan
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="runtime_service_account_email=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply_infra && vars.GCP_PROJECT_ID != '' }}
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish_image }}
          tags: ${{ vars.CONTAINER_IMAGE_PREFIX }}/control-plane:${{ github.sha }}

  summary:
    runs-on: ubuntu-latest
    needs:
      - validate
      - terraform
      - docker
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish image: ${{ inputs.publish_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Apply infra: ${{ inputs.apply_infra }}" >> "$GITHUB_STEP_SUMMARY"
