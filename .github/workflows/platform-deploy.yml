name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      publish_image:
        description: Publish container image
        required: true
        default: false
        type: boolean
      deploy_service:
        description: Deploy service to Cloud Run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run platform gates
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.readiness
          python -m app.platform.gcp.deploy_check
          bash infra/scripts/gate.sh

  docker:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to cloud
        if: ${{ inputs.publish_image && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for registry
        if: ${{ inputs.publish_image && vars.GCP_REGISTRY_HOST != '' }}
        run: gcloud auth configure-docker "${{ vars.GCP_REGISTRY_HOST }}" --quiet

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ vars.CONTAINER_IMAGE_PREFIX }}" ]; then
            echo "tag=${{ vars.CONTAINER_IMAGE_PREFIX }}/control-plane:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ai-software-factory:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard image publish variables
        if: ${{ inputs.publish_image && vars.CONTAINER_IMAGE_PREFIX == '' }}
        run: |
          echo "CONTAINER_IMAGE_PREFIX must be configured before publishing images."
          exit 1

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish_image }}
          tags: ${{ steps.image.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker
    if: ${{ inputs.deploy_service }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard deploy inputs
        if: ${{ !inputs.publish_image || vars.GCP_PROJECT_ID == '' || vars.GCP_REGION == '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' }}
        run: |
          echo "deploy_service requires publish_image plus GCP project, region, workload identity, and deploy service account variables."
          exit 1

      - name: Authenticate to cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run service
        run: |
          commit_timestamp=$(git show -s --format=%cI "${{ github.sha }}")
          gcloud run deploy ai-software-factory-${{ inputs.environment }} \
            --image="${{ needs.docker.outputs.image_tag }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --platform=managed \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="SOURCE_BRANCH=${{ github.ref_name }},SOURCE_COMMIT_SHA=${{ github.sha }},SOURCE_COMMIT_TIMESTAMP=${commit_timestamp},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},KMS_KEY_NAME=${{ vars.KMS_KEY_NAME }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USERNAME=${{ vars.SMTP_USERNAME }},EMAIL_FROM=${{ vars.EMAIL_FROM }},GMAIL_ADDRESS=${{ vars.GMAIL_ADDRESS }}"

      - name: Resolve service URL
        id: service
        run: |
          url=$(gcloud run services describe ai-software-factory-${{ inputs.environment }} \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Service URL: $url"

      - name: Verify Mission Control health
        run: |
          auth_args=()
          if [ "${{ inputs.environment }}" != "production" ]; then
            token=$(gcloud auth print-identity-token)
            auth_args=(-H "Authorization: Bearer ${token}")
          fi
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/health"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/ready"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/mission-control/health"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/mission-control/version"

  summary:
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker
      - deploy
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish image: ${{ inputs.publish_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy service: ${{ inputs.deploy_service }}" >> "$GITHUB_STEP_SUMMARY"
