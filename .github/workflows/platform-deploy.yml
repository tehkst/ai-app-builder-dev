name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run platform gates
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.ops_check
          python -m app.platform.gcp.readiness
          bash infra/scripts/gate.sh

  terraform:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-software-factory:${{ github.sha }}

  summary:
    runs-on: ubuntu-latest
    needs:
      - validate
      - terraform
      - docker
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "P1.10.1 workflow foundation complete." >> "$GITHUB_STEP_SUMMARY"
