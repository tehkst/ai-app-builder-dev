name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      publish_image:
        description: Publish container image
        required: true
        default: false
        type: boolean
      deploy_service:
        description: Deploy service to Cloud Run
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run platform gates
        run: |
          python -m app.platform.gcp.check
          python -m app.platform.gcp.readiness
          python -m app.platform.gcp.deploy_check
          python -m app.platform.gcp.environment_topology_check
          bash infra/scripts/gate.sh

  infrastructure_drift_check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to cloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Compares declared environment_topology.py against live GCP state (Cloud Run's
      # actual Cloud SQL socket connection, its actual DATABASE_URL secret reference,
      # whether the runtime service account can read it) and blocks deploy on drift -
      # this is exactly the class of gap that let staging silently diverge from
      # production undetected.
      - name: Infrastructure drift check
        run: python -m app.platform.gcp.infrastructure_drift_check

  docker:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to cloud
        if: ${{ inputs.publish_image && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for registry
        if: ${{ inputs.publish_image && vars.GCP_REGISTRY_HOST != '' }}
        run: gcloud auth configure-docker "${{ vars.GCP_REGISTRY_HOST }}" --quiet

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ vars.CONTAINER_IMAGE_PREFIX }}" ]; then
            echo "tag=${{ vars.CONTAINER_IMAGE_PREFIX }}/control-plane:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ai-software-factory:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard image publish variables
        if: ${{ inputs.publish_image && vars.CONTAINER_IMAGE_PREFIX == '' }}
        run: |
          echo "CONTAINER_IMAGE_PREFIX must be configured before publishing images."
          exit 1

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.publish_image }}
          tags: ${{ steps.image.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - validate
      - infrastructure_drift_check
      - docker
    if: ${{ inputs.deploy_service }}
    environment: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.service.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard deploy inputs
        if: ${{ !inputs.publish_image || vars.GCP_PROJECT_ID == '' || vars.GCP_REGION == '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' }}
        run: |
          echo "deploy_service requires publish_image plus GCP project, region, workload identity, and deploy service account variables."
          exit 1

      - name: Authenticate to cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run service
        run: |
          commit_timestamp=$(git show -s --format=%cI "${{ github.sha }}")
          # production keeps its own isolated database; every other environment (staging, dev)
          # shares a separate nonprod database so no non-production deploy can ever read or
          # write real customer data. Every environment currently lives on the same Cloud SQL
          # instance (ai-factory-db) - see app/platform/architecture_knowledge_graph/
          # environment_topology.py, the declared source of truth this must stay consistent
          # with (checked by environment_topology_check.py on every PR). The Cloud SQL
          # instance is attached explicitly on every deploy rather than relying on Cloud
          # Run's implicit "carry forward whatever annotation a prior deploy happened to set"
          # behavior, which is exactly what let staging silently lose its connection.
          cloudsql_connection="${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:ai-factory-db"
          if [ "${{ inputs.environment }}" = "production" ]; then
            db_secret=ai-software-factory-production-database-url
          else
            db_secret=ai-software-factory-nonprod-database-url
          fi
          gcloud run deploy ai-software-factory-${{ inputs.environment }} \
            --image="${{ needs.docker.outputs.image_tag }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --platform=managed \
            --add-cloudsql-instances="${cloudsql_connection}" \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="SOURCE_BRANCH=${{ github.ref_name }},SOURCE_COMMIT_SHA=${{ github.sha }},SOURCE_COMMIT_TIMESTAMP=${commit_timestamp},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_REGION=${{ vars.GCP_REGION }},KMS_KEY_NAME=${{ vars.KMS_KEY_NAME }},SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=${{ vars.SMTP_PORT }},SMTP_USERNAME=${{ vars.SMTP_USERNAME }},EMAIL_FROM=${{ vars.EMAIL_FROM }},GMAIL_ADDRESS=${{ vars.GMAIL_ADDRESS }}" \
            --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,FOUNDER_PASSWORD=FOUNDER_PASSWORD:latest,FOUNDER_EMAIL=FOUNDER_EMAIL:latest,MISSION_CONTROL_SESSION_SECRET=MISSION_CONTROL_SESSION_SECRET:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,DATABASE_URL=${db_secret}:latest,SMTP_PASSWORD=smtp-password:latest,GMAIL_APP_PASSWORD=GMAIL_APP_PASSWORD:latest"

      - name: Resolve service URL
        id: service
        run: |
          url=$(gcloud run services describe ai-software-factory-${{ inputs.environment }} \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Service URL: $url"

      - name: Verify Mission Control health
        run: |
          auth_args=()
          if [ "${{ inputs.environment }}" != "production" ]; then
            token=$(gcloud auth print-identity-token)
            auth_args=(-H "Authorization: Bearer ${token}")
          fi
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/health"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/ready"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/mission-control/health"
          curl --fail --silent --show-error "${auth_args[@]}" "${{ steps.service.outputs.url }}/mission-control/version"

  canary:
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: ${{ inputs.deploy_service && inputs.environment == 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canary dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run post-deploy canary check
        env:
          CANARY_BASE_URL: ${{ needs.deploy.outputs.url }}
          CANARY_CUSTOMER_EMAIL: ${{ secrets.CANARY_CUSTOMER_EMAIL }}
          CANARY_CUSTOMER_PASSWORD: ${{ secrets.CANARY_CUSTOMER_PASSWORD }}
        run: python infra/scripts/canary_check.py

  summary:
    runs-on: ubuntu-latest
    needs:
      - validate
      - infrastructure_drift_check
      - docker
      - deploy
      - canary
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish image: ${{ inputs.publish_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy service: ${{ inputs.deploy_service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Infrastructure drift check: ${{ needs.infrastructure_drift_check.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Canary check: ${{ needs.canary.result }}" >> "$GITHUB_STEP_SUMMARY"
