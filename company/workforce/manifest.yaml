  - id: builder
    name: Builder
    department: engineering
    role_file: roles/builder.md
    adapted_from: ["agency-agents: Minimal Change Engineer", "agency-agents: Rapid Prototyper"]
    permission_mode: smart
    autonomy_tier: 1
