# AI Software Factory workforce. Read by app/platform/orca/workforce.py.
# permission_mode: Nautilus PermissionPolicy mode (auto | smart | approve | read_only)
# model_tier: light | standard (default) | strong; the model per tier is in company/ai-pricing.yaml
# autonomy_tier: company/strategy/ai-workforce-plan.md (0 observe, 1 sandbox, 2 reversible, 3 approval)
version: 1
employees:
  - id: architect
    name: Software Architect
    department: architecture
    role_file: roles/architect.md
    summary: Reads the app and turns your goal into a short plan of tasks, each with a check that proves it's done.
    adapted_from: ["agency-agents: Software Architect", "agency-agents: Backend Architect"]
    permission_mode: smart
    autonomy_tier: 0
    responsibilities: [plan_mission]

  - id: builder
    name: Builder
    department: engineering
    role_file: roles/builder.md
    summary: Builds backend and general tasks, fixing whatever the reviewers flag.
    adapted_from: ["agency-agents: Minimal Change Engineer", "agency-agents: Rapid Prototyper"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task, build_task:backend, build_task:general]

  - id: qa_lead
    name: QA Lead
    department: quality
    role_file: roles/qa_lead.md
    summary: Checks every task works as asked, with evidence. Starts from FAIL until shown otherwise.
    adapted_from: ["agency-agents: Reality Checker", "agency-agents: Code Reviewer", "agency-agents: Evidence Collector"]
    permission_mode: smart
    autonomy_tier: 0
    responsibilities: [review_task]

  - id: frontend_developer
    name: Frontend Developer
    department: frontend
    role_file: roles/frontend_developer.md
    summary: Builds the screens people use (pages, forms, navigation), accessible and mobile-friendly.
    adapted_from: ["agency-agents: Frontend Developer", "agency-agents: UI Designer"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:frontend]

  - id: ux_designer
    name: UX Designer
    department: design
    role_file: roles/ux_designer.md
    summary: Reviews every user-facing task as a first-time user would, including accessibility.
    adapted_from: ["agency-agents: UX Architect", "agency-agents: UX Researcher", "agency-agents: Accessibility Auditor", "agency-agents: Persona Walkthrough Specialist"]
    permission_mode: smart
    autonomy_tier: 0
    responsibilities: [review_ux]

  - id: code_auditor
    name: Code Auditor
    department: client_services
    role_file: roles/code_auditor.md
    summary: Reads client codebases and writes the Audit - what's there, what's risky, what to fix first, with evidence.
    adapted_from: ["agency-agents: Codebase Onboarding Engineer", "agency-agents: Code Reviewer", "agency-agents: Technical Writer"]
    permission_mode: read_only
    autonomy_tier: 0
    responsibilities: [audit_codebase]

  - id: security_reviewer
    name: Security Reviewer
    department: quality
    role_file: roles/security_reviewer.md
    summary: Finds security holes in client code and in every change we deliver - leaked keys, injection, broken access.
    adapted_from: ["agency-agents: Application Security Engineer", "agency-agents: AI-Generated Code Security Auditor"]
    permission_mode: read_only
    autonomy_tier: 0
    responsibilities: [review_security]

  - id: php_developer
    name: PHP/WordPress Developer
    department: client_services
    role_file: roles/php_developer.md
    summary: Fixes bugs and builds features in WordPress, WooCommerce, Laravel and plain PHP sites, safely.
    adapted_from: ["agency-agents: Backend Architect", "agency-agents: Senior Developer", "agency-agents: Minimal Change Engineer"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:php]

  - id: upgrade_specialist
    name: Upgrade Specialist
    department: client_services
    role_file: roles/upgrade_specialist.md
    summary: Moves old PHP, WordPress, Laravel and Node versions to supported ones in small, tested steps.
    adapted_from: ["agency-agents: Codebase Onboarding Engineer", "agency-agents: Minimal Change Engineer"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:upgrade]

  - id: database_builder
    name: Database Builder
    department: engineering
    role_file: roles/database_builder.md
    summary: Changes app databases safely, with migrations that can be undone.
    adapted_from: ["agency-agents: Database Optimizer", "agency-agents: Database Reliability Engineer"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:database]

  - id: devops_engineer
    name: DevOps Engineer
    department: engineering
    role_file: roles/devops_engineer.md
    summary: Sets up builds, tests and deployment configuration for clients' apps, without touching anything live.
    adapted_from: ["agency-agents: DevOps Automator", "agency-agents: SRE (Site Reliability Engineer)"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:devops]

  - id: technical_writer
    name: Technical Writer
    department: client_services
    role_file: roles/technical_writer.md
    summary: Writes docs, and a plain-English handover for every client job so they know what changed and how to check it.
    adapted_from: ["agency-agents: Technical Writer", "agency-agents: Executive Summary Generator"]
    permission_mode: smart
    autonomy_tier: 1
    responsibilities: [build_task:docs, write_handover]
    model_tier: light  # plain-English writing: the smaller, cheaper model is enough

# Not hired yet: shown to the founder as "Next to hire" (Mission Control → Company). From the
# Wave 1 table in company/strategy/ai-workforce-plan.md. Orca ignores this list.
planned_hires:
  - name: Test Automation Engineer
    why: Adds tests to client code that has none, so every later fix can be checked.
  - name: Performance Engineer
    why: Finds and fixes slow pages and queries, with before-and-after measurements.
  - name: Proposal Writer
    why: Drafts Upwork proposals and quotes from a client's Health Check.
