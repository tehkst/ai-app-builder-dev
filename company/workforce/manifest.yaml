  - id: qa_lead
    name: QA Lead
    department: quality
    role_file: roles/qa_lead.md
    adapted_from: ["agency-agents: Reality Checker", "agency-agents: Code Reviewer", "agency-agents: Evidence Collector"]
    permission_mode: smart
    autonomy_tier: 0
    responsibilities: [review_task]
