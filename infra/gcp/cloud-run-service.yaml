apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-software-factory
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: ai-factory-runtime
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/ai-factory/app:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8000"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 30
